<!DOCTYPE html>
<html lang="pt-br">

    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

<body>

    {% if usuario.is_authenticated %}
        <a name="user" href="{% url 'UserAccount' usuario.id %}" ><img src="https://placehold.co/120x120" alt="Imagem do usuario"></a>   
    {% endif %}

    <form method="get" action="{% url 'pesquisa' %}">
        <input type="text" name="BarraDePesquisa" placeholder="Pesquisar por Noticia..." required>
        <button type="submit">Buscar</button>
    </form>

    <h1>Últimas notícias</h1>

    <ul>
        {% for noticia in noticias %}
            <li>
                <a href="{% url 'noticia' noticia.id %}"><h2>{{ noticia.titulo }}</h2></a>
                <p>{{ noticia.conteudo|truncatechars:150|safe }}</p>
            </li>
        {% empty %}
            <li>Nenhuma notícia disponível.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'login' %}" >Logue</a>
    <a href="{% url 'register' %}" >Registre</a>
    
    <script src='{% static "js/GetGeoLocation.js" %}'></script>
    
</body>
</html>
