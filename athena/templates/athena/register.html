<!DOCTYPE html>
<html lang="pt-br">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <title>Registre</title>
</head>
<body>

    <!-- Logo no topo -->
    <div class="logo">
        <img src="{% static 'images/athena-logo.png' %}" alt="Athena">
    </div>

    <div class="container">
        <h1 class="text-center">Criar Conta</h1>
        
        <div class="divider divider-red"></div>

        <form method="POST" class="spacing-medium">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Digite um login</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="Nome de usuário" 
                       class="form-input"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Digite um email</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       placeholder="exemplo@gmail.com" 
                       class="form-input"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Digite uma senha</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       placeholder="Senha" 
                       class="form-input"
                       required>
            </div>

            {% if error %}
            <div class="error-message">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary btn-full">Enviar</button>
        </form>

        <div class="divider"></div>

        <p class="text-center">
            Já tem uma conta? <a href="#">Faça login</a>
        </p>
    </div>

</body>
</html>
