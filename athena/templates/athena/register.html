{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta – Portal</title>


    <link rel="stylesheet" href="{% static 'css/athena-styles.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Criar uma conta</h1>
                <p class="auth-subtitle">
                    Registre-se para acompanhar todas as notícias do portal.
                </p>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}


                <div class="auth-input-group">
                    <label for="id_username">Login</label>
                    <div class="auth-input-with-icon">
                        <i class="fas fa-user"></i>
                        <input id="id_username"
                               type="text"
                               name="username"
                               placeholder="Nome de usuário"
                               required>
                    </div>
                </div>


                <div class="auth-input-group">
                    <label for="id_email">E-mail</label>
                    <div class="auth-input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input id="id_email"
                               type="email"
                               name="email"
                               placeholder="seuemail@exemplo.com"
                               required>
                    </div>
                </div>


                        <div class="auth-input-group">
                            <label for="id_password">Senha</label>
                            <div class="auth-input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input id="id_password"
                                    type="password"
                                    name="password"
                                    placeholder="Crie uma senha"
                                    required
                                    pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{6,}"
                                    title="A senha deve ter pelo menos 1 letra maiúscula e 1 caractere especial.">
                                <button type="button"
                                        class="toggle-password"
                                        aria-label="Mostrar ou ocultar senha">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <small class="auth-hint">
                                A senha deve ter pelo menos <strong>1 letra maiúscula</strong> e
                                <strong>1 caractere especial</strong> (ex: ! @ # $ % & *).
                            </small>
                        </div>
                {% if error %}
                    <p class="auth-error">{{ error }}</p>
                {% endif %}

                <button type="submit" class="btn-primary auth-submit">
                    Registrar
                </button>
            </form>

            <p class="auth-footer-text">
                Já tem uma conta?
                <a href="{% url 'login' %}" class="auth-link">Entrar</a>
            </p>
        </div>
    </div>

    <script>
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#id_password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';

                const icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
