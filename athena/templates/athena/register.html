{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Logo no topo -->
    <div class="logo">
        <img src="{% static 'images/athena-logo.png' %}" alt="Athena">
    </div>

    <div class="container">
        <h1 class="text-center">Criar Conta</h1>
        <div class="divider divider-red"></div>

        <form method="POST" class="spacing-medium">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Digite um login</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="Nome de usuário" 
                       class="form-input"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Digite um email</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       placeholder="exemplo@gmail.com" 
                       class="form-input"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Digite uma senha</label>
                <div style="position: relative;">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Senha" 
                           class="form-input"
                           required
                           pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{6,}"
                           title="A senha deve ter pelo menos 1 letra maiúscula e 1 caractere especial.">
                    <button type="button"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;"
                            class="toggle-password"
                            aria-label="Mostrar ou ocultar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            {% if error %}
            <div class="error-message">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary btn-full">Enviar</button>
        </form>

        <div class="divider"></div>

        <p class="text-center">
            Já tem uma conta? <a href="{% url 'login' %}">Faça login</a>
        </p>
    </div>

    <!-- Script para mostrar/ocultar senha -->
    <script>
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';

                const icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                }
            });
        }
    </script>

</body>
</html>
