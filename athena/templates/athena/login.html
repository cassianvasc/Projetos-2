{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Portal</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'Athenas.svg' %}">
    <!-- CSS antigo do site -->
    <link rel="stylesheet" href="{% static 'css/athena-styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <!-- Botão voltar fixo -->
    <a href="{% url 'home' %}" class="back-btn-fixed" aria-label="Voltar">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="auth-wrapper">
        <div class="auth-card">

            <form method="POST" class="auth-form">
                {% csrf_token %}
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}

                <div class="auth-input-group">
                    <label for="id_username">Login</label>
                    <div class="auth-input-with-icon">
                        <i class="fas fa-user"></i>
                        <input id="id_username"
                               type="text"
                               name="username"
                               placeholder="Nome de usuário"
                               required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="id_password">Senha</label>
                    <div class="auth-input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input id="id_password"
                               type="password"
                               name="password"
                               placeholder="Digite sua senha"
                               required>
                        <button type="button"
                                class="toggle-password"
                                aria-label="Mostrar ou ocultar senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                {% if error %}
                    <p class="auth-error">{{ error }}</p>
                {% endif %}

                <button type="submit" class="entry_button">Entrar</button>

            </form>

        </div>
    </div>

    <a href="{% url 'register' %}" >Criar conta</a>

    <!-- Script: mostrar/ocultar senha -->
    <script>
        const toggleBtn = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#id_password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';

                const icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
